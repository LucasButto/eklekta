<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>eklekta</title>
    <meta
      name="description"
      content="Estudio digital. Automatizamos procesos, implementamos CRM y diseñamos productos que se entienden solos."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0b10"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://eklekta.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="eklekta" />
    <meta
      property="og:title"
      content="eklekta — Automatización, CRM, desarrollo web y UX/UI"
    />
    <meta
      property="og:description"
      content="Automatizamos procesos, implementamos CRM y diseñamos productos que se entienden solos."
    />
    <meta property="og:image" content="/images/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      href="/fonts/MonumentExtended-Ultrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Poppins-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Applies the stored theme before first paint so the page never
         flashes, then preloads the matching hero photo (day vs night —
         see Hero.tsx) so the largest paint isn't waiting on React to
         mount before its fetch even starts. Built here instead of as
         static <link> tags because which photo is "correct" depends on
         localStorage, which markup alone can't branch on. `type` lets
         browsers without WebP support skip this and fetch the
         <picture> element's JPEG fallback instead, so nothing
         double-fetches. -->
    <script>
      (function () {
        var theme = "light";
        try {
          theme =
            localStorage.getItem("eklekta-theme") === "dark"
              ? "dark"
              : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;

        function preload(media, href, srcset) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/webp";
          if (media) link.media = media;
          link.href = href;
          link.setAttribute("imagesrcset", srcset);
          link.setAttribute("imagesizes", "100vw");
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        }

        if (theme === "dark") {
          // One landscape source only — the night photo has no
          // dedicated mobile crop (see Hero.tsx).
          preload(
            null,
            "/images/hero/hero-night-1600.webp",
            "/images/hero/hero-night-960.webp 960w, /images/hero/hero-night-1600.webp 1600w, /images/hero/hero-night-2560.webp 2560w, /images/hero/hero-night-3840.webp 3840w",
          );
        } else {
          // `media` mirrors the <picture> breakpoint so a phone never
          // preloads the desktop shot it is not going to display.
          preload(
            "(max-width: 767px)",
            "/images/hero/new-hero-mobile-640.webp",
            "/images/hero/new-hero-mobile-640.webp 640w, /images/hero/new-hero-mobile-1024.webp 1024w",
          );
          preload(
            "(min-width: 768px)",
            "/images/hero/hero-day-1600.webp",
            "/images/hero/hero-day-960.webp 960w, /images/hero/hero-day-1600.webp 1600w, /images/hero/hero-day-2560.webp 2560w, /images/hero/hero-day-3840.webp 3840w",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
