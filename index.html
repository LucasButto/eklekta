    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Una sola URL canónica: el dominio sin www. El .htaccess redirige
         www → sin www, así Google no indexa el mismo sitio dos veces. -->

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Twitter: las URLs tienen que ser absolutas, los

    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="eklekta" />
    <meta property="og:url" content="https://eklekta.com.ar/" />

    <!-- Datos estructurados. Organization y no LocalBusiness: el sitio no
         publica una dirección, y esos tipos la piden (`address`). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://eklekta.com.ar/#organization",
            "name": "eklekta",
            "url": "https://eklekta.com.ar/",
            "logo": "https://eklekta.com.ar/images/logo-512.png",
            "image": "https://eklekta.com.ar/images/og.jpg",
            "email": "contacto@eklekta.com.ar",
            "description": "Estudio digital en Argentina: automatización de procesos, implementación de CRM, desarrollo web a medida y diseño UX/UI.",
            "areaServed": [
              { "@type": "Country", "name": "Argentina" },
              { "@type": "Place", "name": "Latinoamérica" },
              { "@type": "Country", "name": "España" }
            ],
            "knowsAbout": [
              "Automatización de procesos",
              "Implementación de CRM",
              "Desarrollo web a medida",
              "Diseño UX/UI"
            ],
            "sameAs": [
              "https://www.instagram.com/eklekta.estudio/",
              "https://www.linkedin.com/company/112493054/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://eklekta.com.ar/#website",
            "url": "https://eklekta.com.ar/",
            "name": "eklekta",
            "inLanguage": "es-AR",
            "publisher": { "@id": "https://eklekta.com.ar/#organization" }

    <link
      rel="preload"
      href="/fonts/MonumentExtended-Ultrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Poppins-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- El build (scripts/postbuild.mjs) inyecta el HTML ya renderizado
         dentro de #root con `data-prerendered`, para que los bots lean el
         contenido sin ejecutar JS. Con JS activo ese markup no se tiene
         que ver nunca: se oculta acá y main.tsx saca el atributo en el
         primer commit de React, antes del primer pintado. Sin JS (o con
         JS bloqueado) el <noscript> lo vuelve a mostrar. -->
    <style>
      #root[data-prerendered] > * {
        visibility: hidden;
      }
    </style>
    <noscript>
      <style>
        #root[data-prerendered] > * {
          visibility: visible;
        }
      </style>
    </noscript>

    <!-- Applies the stored theme before first paint so the page never
         flashes, then preloads the matching hero photo (day vs night —
         see Hero.tsx) so the largest paint isn't waiting on React to
         mount before its fetch even starts. Built here instead of as
         static <link> tags because which photo is "correct" depends on
         localStorage, which markup alone can't branch on. `type` lets
         browsers without WebP support skip this and fetch the
         <picture> element's JPEG fallback instead, so nothing
         double-fetches. -->
    <script>
      (function () {
        var theme = "light";
        try {
          theme =
            localStorage.getItem("eklekta-theme") === "dark"
              ? "dark"
              : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;

        function preload(media, href) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/webp";
          if (media) link.media = media;
          link.href = href;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        }

        // `media` mirrors the <picture> breakpoint so a phone never
        // preloads the desktop shot it is not going to display, and
        // vice versa. One file each — no srcset, see Hero.tsx.
        var prefix = theme === "dark" ? "hero-night" : "hero-day";
        preload("(max-width: 767px)", "/images/hero/" + prefix + "-mobile.webp");
        preload("(min-width: 768px)", "/images/hero/" + prefix + "-desktop.webp");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
